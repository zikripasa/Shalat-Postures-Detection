<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif">
  <title>Salat Vision — system architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0E1B33"/>
    </marker>
    <style>
      .col { fill: #F3F5F4; stroke: #DFE3E1; stroke-width: 1.5; }
      .box { fill: #FFFFFF; stroke: #0E1B33; stroke-width: 1.5; }
      .key { fill: #E3F1EF; stroke: #0F766E; stroke-width: 2; }
      .h { font-size: 22px; font-weight: 700; fill: #0E1B33; }
      .t { font-size: 15.5px; font-weight: 700; fill: #0E1B33; }
      .s { font-size: 13.5px; fill: #4A5565; }
      .n { font-size: 13px; font-weight: 600; fill: #B8892C; }
      .flow { stroke: #0E1B33; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FCFCFB"/>
  <rect width="1600" height="84" fill="#0E1B33"/>
  <g transform="translate(40 26)" fill="none" stroke="#B8892C" stroke-width="2" stroke-linejoin="round">
    <rect x="6" y="6" width="20" height="20"/><rect x="6" y="6" width="20" height="20" transform="rotate(45 16 16)"/>
  </g>
  <text x="86" y="52" font-size="26" font-weight="800" fill="#FFFFFF">Salat Vision — system architecture</text>
  <text x="1560" y="52" font-size="15" fill="#C9D1D9" text-anchor="end">from a ZIP of annotated images to a browser timeline</text>

  <!-- column backgrounds -->
  <g>
    <rect class="col" x="30" y="110" width="290" height="760" rx="14"/>
    <rect class="col" x="345" y="110" width="320" height="760" rx="14"/>
    <rect class="col" x="690" y="110" width="270" height="760" rx="14"/>
    <rect class="col" x="985" y="110" width="320" height="760" rx="14"/>
    <rect class="col" x="1330" y="110" width="240" height="760" rx="14"/>
  </g>
  <text class="n" x="52" y="146">1</text><text class="h" x="72" y="148">Data</text>
  <text class="n" x="367" y="146">2</text><text class="h" x="387" y="148">Experiments</text>
  <text class="n" x="712" y="146">3</text><text class="h" x="732" y="148">Model bundle</text>
  <text class="n" x="1007" y="146">4</text><text class="h" x="1027" y="148">Serving (FastAPI)</text>
  <text class="n" x="1352" y="146">5</text><text class="h" x="1372" y="148">Client (React)</text>

  <!-- 1 Data -->
  <rect class="box" x="50" y="175" width="250" height="118" rx="10"/>
  <text class="t" x="66" y="203">Dataset archive</text>
  <text class="s" x="66" y="228">Salat-Postures-Dataset-main</text>
  <text class="s" x="66" y="249">41 images, 39 Pascal VOC XML</text>
  <text class="s" x="66" y="270">4 annotated postures</text>
  <rect class="box" x="50" y="333" width="250" height="118" rx="10"/>
  <text class="t" x="66" y="361">Safe extraction</text>
  <text class="s" x="66" y="386">path-traversal, symlink and</text>
  <text class="s" x="66" y="407">zip-bomb guards; SHA-256 check</text>
  <text class="s" x="66" y="428">data/raw (never modified)</text>
  <rect class="box" x="50" y="491" width="250" height="140" rx="10"/>
  <text class="t" x="66" y="519">Audit and leakage groups</text>
  <text class="s" x="66" y="544">40 people in 37 images</text>
  <text class="s" x="66" y="565">pHash duplicates + reviewed</text>
  <text class="s" x="66" y="586">capture sessions</text>
  <text class="s" x="66" y="607">29 independent groups</text>
  <rect class="box" x="50" y="671" width="250" height="96" rx="10"/>
  <text class="t" x="66" y="699">Group k-fold splits</text>
  <text class="s" x="66" y="724">3 x stratified group 5-fold</text>
  <text class="s" x="66" y="745">data/splits/cv_splits.json</text>
  <path class="flow" d="M175 293 V331"/><path class="flow" d="M175 451 V489"/><path class="flow" d="M175 631 V669"/>

  <!-- 2 Experiments -->
  <rect class="box" x="365" y="175" width="280" height="160" rx="10"/>
  <text class="t" x="381" y="203">Feature cache</text>
  <text class="s" x="381" y="228">MediaPipe Pose Landmarker (full):</text>
  <text class="s" x="381" y="249">33 landmarks -> 19 view-tolerant</text>
  <text class="s" x="381" y="270">angle / position features</text>
  <text class="s" x="381" y="295">ImageNet embeddings:</text>
  <text class="s" x="381" y="316">MobileNetV3-Large, ResNet18</text>
  <rect class="box" x="365" y="375" width="280" height="160" rx="10"/>
  <text class="t" x="381" y="403">11 candidate models, one protocol</text>
  <text class="s" x="381" y="428">baseline, pose rules, 4 pose classifiers,</text>
  <text class="s" x="381" y="449">2 frozen-CNN probes, 2 fine-tuned,</text>
  <text class="s" x="381" y="470">pre-registered fusion</text>
  <text class="s" x="381" y="495">nested inner CV for hyper-parameters,</text>
  <text class="s" x="381" y="516">cluster-bootstrap 95% CIs</text>
  <rect class="key" x="365" y="575" width="280" height="120" rx="10"/>
  <text class="t" x="381" y="603">Selected: pose + CNN fusion</text>
  <text class="s" x="381" y="628">macro-F1 0.80 [0.68-0.90] on crops</text>
  <text class="s" x="381" y="649">0.68 [0.53-0.86] end-to-end images</text>
  <text class="s" x="381" y="670">decoder chosen on a validation seed</text>
  <rect class="box" x="365" y="735" width="280" height="96" rx="10"/>
  <text class="t" x="381" y="763">Benchmarks</text>
  <text class="s" x="381" y="788">CPU latency, pose variants,</text>
  <text class="s" x="381" y="809">semi-synthetic temporal benchmark</text>
  <path class="flow" d="M505 335 V373"/><path class="flow" d="M505 535 V573"/>
  <path class="flow" d="M300 719 C 330 719, 330 455, 363 455"/>

  <!-- 3 Bundle -->
  <rect class="box" x="710" y="175" width="230" height="118" rx="10"/>
  <text class="t" x="726" y="203">Final training</text>
  <text class="s" x="726" y="228">selected pipeline fit on</text>
  <text class="s" x="726" y="249">all 40 instances</text>
  <text class="s" x="726" y="270">(inner CV picks C)</text>
  <rect class="key" x="710" y="333" width="230" height="182" rx="10"/>
  <text class="t" x="726" y="361">models/salat_vision_v1</text>
  <text class="s" x="726" y="386">ONNX MobileNetV3 embedder</text>
  <text class="s" x="726" y="407">(parity cos 0.9999999)</text>
  <text class="s" x="726" y="428">pose + image classifiers</text>
  <text class="s" x="726" y="449">manifest: classes, metrics,</text>
  <text class="s" x="726" y="470">preprocessing, SHA-256</text>
  <text class="s" x="726" y="491">11.9 MB, no PyTorch needed</text>
  <rect class="box" x="710" y="555" width="230" height="118" rx="10"/>
  <text class="t" x="726" y="583">Third-party models</text>
  <text class="s" x="726" y="608">Pose Landmarker (full)</text>
  <text class="s" x="726" y="629">EfficientDet-Lite0 (person)</text>
  <text class="s" x="726" y="650">Apache-2.0, checksummed</text>
  <path class="flow" d="M645 635 C 680 635, 680 234, 708 234"/>
  <path class="flow" d="M825 293 V331"/>

  <!-- 4 Serving -->
  <rect class="box" x="1005" y="175" width="280" height="140" rx="10"/>
  <text class="t" x="1021" y="203">REST API</text>
  <text class="s" x="1021" y="228">GET /health, GET /model-info</text>
  <text class="s" x="1021" y="249">POST /predict/image, /predict/video</text>
  <text class="s" x="1021" y="270">POST /jobs/video, GET /jobs/{id}</text>
  <text class="s" x="1021" y="291">/jobs/{id}/video, /report (JSON, CSV)</text>
  <rect class="key" x="1005" y="355" width="280" height="160" rx="10"/>
  <text class="t" x="1021" y="383">Inference engine</text>
  <text class="s" x="1021" y="408">detector -> crop -> pose features</text>
  <text class="s" x="1021" y="429">+ ONNX embedding -> fusion</text>
  <text class="s" x="1021" y="450">-> HMM (7 states, prayer grammar)</text>
  <text class="s" x="1021" y="471">-> local context rules -> 6 phases</text>
  <text class="s" x="1021" y="492">84 ms/frame on 4 vCPU</text>
  <rect class="box" x="1005" y="555" width="280" height="140" rx="10"/>
  <text class="t" x="1021" y="583">Jobs and privacy</text>
  <text class="s" x="1021" y="608">thread pool, real progress</text>
  <text class="s" x="1021" y="629">size, type and magic-byte checks</text>
  <text class="s" x="1021" y="650">uploads deleted after analysis,</text>
  <text class="s" x="1021" y="671">results expire after 30 min</text>
  <path class="flow" d="M940 424 H1003"/>
  <path class="flow" d="M1145 315 V353"/><path class="flow" d="M1145 515 V553"/>

  <!-- 5 Client -->
  <rect class="box" x="1350" y="175" width="200" height="118" rx="10"/>
  <text class="t" x="1366" y="203">Web app</text>
  <text class="s" x="1366" y="228">React 19, TypeScript</text>
  <text class="s" x="1366" y="249">Vite, Tailwind, Recharts</text>
  <text class="s" x="1366" y="270">Indonesian interface</text>
  <rect class="box" x="1350" y="333" width="200" height="140" rx="10"/>
  <text class="t" x="1366" y="361">Pages</text>
  <text class="s" x="1366" y="386">Beranda (status)</text>
  <text class="s" x="1366" y="407">Analisis (upload,</text>
  <text class="s" x="1366" y="428">camera, photo)</text>
  <text class="s" x="1366" y="449">Hasil, Model</text>
  <rect class="key" x="1350" y="513" width="200" height="182" rx="10"/>
  <text class="t" x="1366" y="541">Outputs</text>
  <text class="s" x="1366" y="566">phase timeline</text>
  <text class="s" x="1366" y="587">segment table</text>
  <text class="s" x="1366" y="608">duration + confidence</text>
  <text class="s" x="1366" y="629">annotated MP4</text>
  <text class="s" x="1366" y="650">JSON / CSV report</text>
  <path class="flow" d="M1285 245 H1348"/>
  <path class="flow" d="M1450 293 V331"/><path class="flow" d="M1450 473 V511"/>

  <!-- phase band -->
  <g transform="translate(1350 725)">
    <rect x="0" y="0" width="31" height="16" rx="3" fill="#EDA100"/>
    <rect x="33" y="0" width="31" height="16" rx="3" fill="#1BAF7A"/>
    <rect x="66" y="0" width="31" height="16" rx="3" fill="#EB6834"/>
    <rect x="99" y="0" width="31" height="16" rx="3" fill="#2A78D6"/>
    <rect x="132" y="0" width="31" height="16" rx="3" fill="#008300"/>
    <rect x="165" y="0" width="35" height="16" rx="3" fill="#E87BA4"/>
    <text x="0" y="40" class="s">6 phases from 4 postures</text>
  </g>
</svg>
