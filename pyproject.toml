[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "salat-vision"
version = "0.1.0"
description = "Salat Vision: prayer-posture recognition from images and video (pose landmarks + CNN embeddings + grammar-constrained temporal decoding)."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Salat Vision contributors" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "pillow>=10.0",
  "opencv-python-headless>=4.9",
  "mediapipe>=0.10.30",
  "pyyaml>=6.0",
  "joblib>=1.3",
  "imagehash>=4.3",
  "onnxruntime>=1.18",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
train = ["torch>=2.2", "torchvision>=0.17", "onnx>=1.16", "onnxscript>=0.1", "matplotlib>=3.8", "seaborn>=0.13", "tqdm>=4.66"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9", "pydantic>=2.6", "pydantic-settings>=2.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "nbformat>=5.9", "nbclient>=0.10", "nbconvert>=7.16", "ipykernel>=6.29", "python-pptx>=0.6.23", "pypdf>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
salat_vision = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: tests that run real models on real images (deselect with -m 'not slow')",
  "requires_model: tests that need the exported model bundle in models/",
  "requires_data: tests that need the extracted dataset in data/raw",
]
